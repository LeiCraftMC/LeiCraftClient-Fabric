# .gitlab/ci/release.yml - release stage, triggered by a `v*` tag.
#
# The jar is only ever built here: branch pipelines just run the tests, so
# tagging is what produces an artifact.
#
# `release:upload` builds the jar and pushes it to the project's generic package
# registry; `release:publish` then creates the GitLab Release pointing at it, or
# attaches the jar to the Release if one was already made by hand in the UI.
# The two are split because building needs a JDK image and the Release API
# calls need glab.

release:upload:
  stage: release
  image: eclipse-temurin:25-jdk
  variables:
    PACKAGE_REGISTRY: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/leicraftclient"
  before_script:
    - chmod +x ./gradlew
    - apt-get update && apt-get install -y --no-install-recommends curl
  script:
    # build.gradle.kts takes the version from CI_COMMIT_TAG, so the jar is named
    # after the tag.
    - ./gradlew build --no-daemon
    - VERSION="${CI_COMMIT_TAG#v}"
    - JAR="$(find build/libs -name "*-${VERSION}.jar" ! -name "*-sources.jar" | head -1)"
    - test -n "$JAR" || { echo "no jar built for $VERSION"; ls -l build/libs; exit 1; }
    - echo "uploading $JAR"
    - |
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file "$JAR" \
        "$PACKAGE_REGISTRY/$VERSION/leicraftclient-$VERSION.jar"
    # release:publish builds the asset URL from this, so both jobs agree on
    # the version with the leading "v" stripped.
    - echo "VERSION=$VERSION" > release.env
  artifacts:
    name: "leicraftclient-$CI_COMMIT_TAG"
    paths:
      - build/libs/*.jar
    expire_in: 4 weeks
    reports:
      dotenv: release.env

  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

# This is a script rather than the `release:` keyword because the keyword runs
# `glab release create --no-update`, which fails when the Release already
# exists -- and creating a Release in the GitLab UI is also what pushes the tag
# that starts this pipeline, so with that workflow it always exists.
release:publish:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:v1.123.0
  needs:
    - release:upload
  variables:
    # glab signs in with CI_JOB_TOKEN, which the Releases API accepts.
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  before_script: []
  cache: {}
  script:
    - ASSET_NAME="leicraftclient-${VERSION}.jar"
    - ASSET_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/leicraftclient/${VERSION}/${ASSET_NAME}"
    - |
      ASSETS="$(jq -nc --arg name "$ASSET_NAME" --arg url "$ASSET_URL" '[{name: $name, url: $url, link_type: "package"}]')"
      if glab release view "$CI_COMMIT_TAG" -R "$CI_PROJECT_URL" -F json > release.json; then
        # Made by hand: keep its name and notes and only attach the jar. A
        # duplicate link name is rejected, so skip it if a retry already did.
        if jq -e --arg name "$ASSET_NAME" 'any(.assets.links[]?; .name == $name)' release.json > /dev/null; then
          echo "$ASSET_NAME is already attached to $CI_COMMIT_TAG"
        else
          glab release upload "$CI_COMMIT_TAG" -R "$CI_PROJECT_URL" --assets-links "$ASSETS"
        fi
      else
        # --no-update: if the lookup above failed for any reason other than a
        # missing Release, fail here instead of overwriting its name.
        glab release create "$CI_COMMIT_TAG" -R "$CI_PROJECT_URL" \
          --name "LeiCraftClient $CI_COMMIT_TAG" \
          --notes "Automated release for $CI_COMMIT_TAG." \
          --ref "$CI_COMMIT_SHA" \
          --assets-links "$ASSETS" \
          --no-update
      fi

  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
