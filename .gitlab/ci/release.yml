# .gitlab/ci/release.yml - release stage, triggered by a `v*` tag.
#
# `release:upload` builds the jar and pushes it to the project's generic package
# registry; `release:publish` then creates the GitLab Release pointing at it.
# The two are split because building needs a JDK image and the Release API needs
# release-cli.

release:upload:
  stage: release
  image: eclipse-temurin:25-jdk
  variables:
    PACKAGE_REGISTRY: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/leicraftclient"
  before_script:
    - chmod +x ./gradlew
    - apt-get update && apt-get install -y --no-install-recommends curl
  script:
    # build.gradle.kts takes the version from CI_COMMIT_TAG, so the jar is named
    # after the tag.
    - ./gradlew build --no-daemon
    - VERSION="${CI_COMMIT_TAG#v}"
    - JAR="$(find build/libs -name "*-${VERSION}.jar" ! -name "*-sources.jar" | head -1)"
    - test -n "$JAR" || { echo "no jar built for $VERSION"; ls -l build/libs; exit 1; }
    - echo "uploading $JAR"
    - |
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file "$JAR" \
        "$PACKAGE_REGISTRY/$VERSION/leicraftclient-$VERSION.jar"

  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

release:publish:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - release:upload
  before_script: []
  cache: {}
  script:
    - echo "publishing release $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "LeiCraftClient $CI_COMMIT_TAG"
    description: "Automated release for $CI_COMMIT_TAG."
    assets:
      links:
        - name: "leicraftclient-${VERSION}.jar"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/leicraftclient/${VERSION}/leicraftclient-${VERSION}.jar"
          link_type: package

  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
