# .gitlab/ci/testing.yml - test stage.
# Minecraft 26.3 requires JDK 25, which fixes the base image.

default:
  image: eclipse-temurin:25-jdk
  interruptible: true
  cache:
    # cache:key:files takes at most two entries, so key on the two files that
    # decide what gets resolved: build.gradle.kts for the dependency list and
    # gradle.properties for the Minecraft, Loom and Fabric versions. A Gradle
    # version bump reuses the key, which only means the new distribution is
    # added to the cached wrapper dir.
    key:
      files:
        - build.gradle.kts
        - gradle.properties
    paths:
      - .gradle/caches/
      - .gradle/wrapper/
  # gradlew is committed with the executable bit set; this is just a belt and
  # braces in case a checkout drops it.
  before_script:
    - chmod +x ./gradlew

# Kotlin has no separate typecheck step -- compiling is the typecheck.
test:compile:
  stage: test
  script:
    - ./gradlew assemble --no-daemon

test:unit:
  stage: test
  script:
    - ./gradlew test --no-daemon
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/TEST-*.xml
    paths:
      - build/reports/tests/test/
    expire_in: 1 week
